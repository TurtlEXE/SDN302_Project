openapi: 3.0.3
info:
  title: Sport Booking Platform API
  description: |
    API hợp đồng cho nền tảng đặt sân thể thao (sport-booking).
    Kiến trúc: Node.js / Express backend theo layer, MongoDB Replica Set, React SPA frontend.
    Xác thực: JWT Access Token (10 phút, lưu trong RAM) + Refresh Token ngẫu nhiên (lưu cookie HttpOnly, phiên tối đa 7 ngày).
    Bảo mật mutation auth: Yêu cầu Origin allowlist + header X-CSRF-Guard: 1.
    Thanh toán: VNPay 100% không thu hoa hồng, xử lý callback bất đồng bộ idempotent.
  version: 1.0.0
  license:
    name: MIT
servers:
  - url: http://localhost:5000/api/v1
    description: Môi trường phát triển cục bộ (Local Development)
  - url: /api/v1
    description: Môi trường triển khai chung Origin (Production / Staging qua Reverse Proxy)

security: []

paths:
  # ============================================================================
  # AUTHENTICATION
  # ============================================================================
  /auth/register:
    post:
      operationId: registerCustomer
      tags: [Auth]
      summary: Đăng ký tài khoản khách hàng (CUSTOMER)
      description: Tạo tài khoản CUSTOMER chưa xác thực và gửi email liên kết xác thực (hạn 15 phút).
      parameters:
        - $ref: '#/components/parameters/CsrfGuardHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công, vui lòng kiểm tra email xác thực.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email đã tồn tại trong hệ thống.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [Auth]
      summary: Xác thực email tài khoản
      description: Tiêu thụ token dùng 1 lần từ email để kích hoạt tài khoản khách hàng.
      parameters:
        - $ref: '#/components/parameters/CsrfGuardHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Token ngẫu nhiên từ liên kết trong email
      responses:
        '200':
          description: Xác thực email thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Token không hợp lệ hoặc đã hết hạn/đã dùng.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [Auth]
      summary: Gửi lại email xác thực tài khoản
      description: Vô hiệu hóa token cũ và phát hành token xác thực mới (giới hạn 60s/lần).
      parameters:
        - $ref: '#/components/parameters/CsrfGuardHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Yêu cầu gửi lại email đã được tiếp nhận.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /auth/activate-owner:
    post:
      operationId: activateOwner
      tags: [Auth]
      summary: Kích hoạt tài khoản chủ sân (OWNER)
      description: Dành cho OWNER do Admin cấp; xác thực email và tự đặt mật khẩu đầu tiên.
      parameters:
        - $ref: '#/components/parameters/CsrfGuardHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateOwnerRequest'
      responses:
        '200':
          description: Kích hoạt tài khoản chủ sân thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Token kích hoạt không hợp lệ hoặc mật khẩu không đúng định dạng.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [Auth]
      summary: Yêu cầu đặt lại mật khẩu qua email
      description: Gửi liên kết đặt lại mật khẩu nếu email tồn tại (phản hồi chung để bảo mật danh tính).
      parameters:
        - $ref: '#/components/parameters/CsrfGuardHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Hướng dẫn đặt lại mật khẩu đã được gửi nếu email hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [Auth]
      summary: Đặt lại mật khẩu mới bằng token email
      description: Đổi mật khẩu thành công sẽ vô hiệu hóa token và thu hồi toàn bộ phiên đăng nhập cũ.
      parameters:
        - $ref: '#/components/parameters/CsrfGuardHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Đặt lại mật khẩu thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Đăng nhập hệ thống
      description: Xác thực bằng email & mật khẩu; trả về Access Token trong JSON và đặt cookie refresh_token HttpOnly.
      parameters:
        - $ref: '#/components/parameters/CsrfGuardHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refresh_token=abc123hex...; Path=/api/v1/auth; HttpOnly; SameSite=Lax; Max-Age=604800
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Sai email hoặc mật khẩu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Tài khoản chưa xác thực/kích hoạt hoặc đã bị khóa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      summary: Làm mới Access Token (Token Rotation)
      description: Đọc cookie refresh_token, thực hiện rotation nguyên tử và cấp Access Token mới.
      parameters:
        - $ref: '#/components/parameters/CsrfGuardHeader'
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Cấp token mới thành công.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refresh_token=newHex...; Path=/api/v1/auth; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Refresh token không hợp lệ, hết hạn hoặc phát hiện tái sử dụng (reuse).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Đăng xuất phiên hiện tại
      description: Thu hồi session gắn với cookie refresh_token hiện tại và xóa cookie trình duyệt.
      parameters:
        - $ref: '#/components/parameters/CsrfGuardHeader'
      security:
        - CookieAuth: []
      responses:
        '204':
          description: Đăng xuất thành công. Xóa cookie.
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/logout-all:
    post:
      operationId: logoutAll
      tags: [Auth]
      summary: Đăng xuất tất cả các phiên
      description: Tăng tokenVersion và thu hồi toàn bộ session đang mở của người dùng.
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Đã thu hồi toàn bộ phiên.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [Auth]
      summary: Đổi mật khẩu cho người dùng đã đăng nhập
      description: Yêu cầu mật khẩu hiện tại và mật khẩu mới. Thu hồi toàn bộ phiên sau khi đổi.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Đổi mật khẩu thành công. Vui lòng đăng nhập lại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================================
  # USERS / PROFILE
  # ============================================================================
  /users/me:
    get:
      operationId: getCurrentUser
      tags: [Users]
      summary: Lấy thông tin hồ sơ người dùng hiện tại
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Thông tin hồ sơ cá nhân của người dùng.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/UserDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      operationId: updateProfile
      tags: [Users]
      summary: Cập nhật thông tin cá nhân (họ tên, số điện thoại)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                phoneNumber:
                  type: string
      responses:
        '200':
          description: Cập nhật hồ sơ thành công.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/UserDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================================
  # PUBLIC SPORTS & FACILITIES
  # ============================================================================
  /sports:
    get:
      operationId: listActiveSports
      tags: [Sports]
      summary: Danh sách môn thể thao đang hoạt động
      responses:
        '200':
          description: Danh sách môn thể thao đang hoạt động.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SportDTO'
        '400':
          $ref: '#/components/responses/ValidationError'

  /facilities:
    get:
      operationId: listFacilities
      tags: [Facilities]
      summary: Tìm kiếm và lọc danh sách cơ sở thể thao công khai
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
          description: Tìm theo tên cơ sở hoặc địa chỉ
        - name: sportId
          in: query
          schema:
            type: string
          description: Lọc theo môn thể thao
        - name: province
          in: query
          schema:
            type: string
          description: Lọc theo tỉnh / thành phố
        - name: minPrice
          in: query
          schema:
            type: integer
        - name: maxPrice
          in: query
          schema:
            type: integer
        - name: sort
          in: query
          schema:
            type: string
            enum: [name_asc, name_desc, price_asc, price_desc]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Danh sách cơ sở thể thao thỏa điều kiện lọc.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFacilityResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /facilities/{id}:
    get:
      operationId: getFacilityById
      tags: [Facilities]
      summary: Chi tiết cơ sở thể thao, danh sách môn và sân con
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chi tiết cơ sở thể thao và danh sách sân con.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/FacilityDetailDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /courts/{id}/schedule:
    get:
      operationId: getCourtSchedule
      tags: [Schedules]
      summary: Xem lịch trống theo sân con và ngày chơi
      description: Trả về cấu hình bước giờ và tình trạng các ô (AVAILABLE, HOLD, BOOKED, BLOCKED, PAST).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID sân con (Court ID)
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2026-11-05'
          description: Ngày chơi định dạng YYYY-MM-DD (Asia/Ho_Chi_Minh)
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [CUSTOMER, OWNER]
            default: CUSTOMER
          description: Vai trò truy vấn lịch (CUSTOMER yêu cầu >= 15 phút báo trước; OWNER cho phép đặt sát giờ với minAdvance = 0)
      responses:
        '200':
          description: Lưới lịch ô giờ và trạng thái chi tiết của sân.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/CourtScheduleDTO'
        '400':
          description: Ngày không hợp lệ hoặc quá 30 ngày.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # CUSTOMER BOOKING REQUESTS & BOOKINGS
  # ============================================================================
  /booking-requests:
    post:
      operationId: createBookingRequest
      tags: [Bookings]
      summary: Tạo yêu cầu đặt sân và giữ chỗ 10 phút
      description: |
        Nhận danh sách ô giờ, kiểm tra xung đột nguyên tử trên CourtDaySchedule,
        gộp các ô liên tiếp thành các Booking dạng khoảng và tạo PaymentOrder 100% tổng tiền.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Tạo yêu cầu đặt thành công, đang giữ chỗ trong 10 phút.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/BookingRequestCreatedDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Trùng lịch (SCHEDULE_CONFLICT) hoặc cấu hình giá/giờ đã thay đổi (CONFIG_VERSION_MISMATCH).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /booking-requests/{id}:
    get:
      operationId: getBookingRequestById
      tags: [Bookings]
      summary: Chi tiết yêu cầu đặt sân và trạng thái thanh toán
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chi tiết yêu cầu đặt sân và các Booking con.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/BookingRequestDetailDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /booking-requests/{id}/cancel:
    post:
      operationId: cancelBookingRequest
      tags: [Bookings]
      summary: Khách hàng tự hủy yêu cầu đặt khi còn PENDING_PAYMENT
      description: Hủy toàn bộ BookingRequest và các Booking con, đóng PaymentOrder và nhả lịch giữ.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: Đổi kế hoạch cá nhân
      responses:
        '200':
          description: Đã hủy yêu cầu đặt và giải phóng lịch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Đơn đã thanh toán hoặc đã hết hạn, không thể tự hủy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /bookings:
    get:
      operationId: listMyBookings
      tags: [Bookings]
      summary: Danh sách đơn đặt sân của khách hàng hiện tại
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [UPCOMING, HISTORY, PENDING_PAYMENT, CONFIRMED, COMPLETED, CANCELLED]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Danh sách đơn đặt sân của người dùng.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /bookings/{id}:
    get:
      operationId: getBookingById
      tags: [Bookings]
      summary: Chi tiết đơn đặt sân của khách hàng
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thông tin chi tiết một đơn đặt sân.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/BookingDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # PAYMENTS & VNPAY GATEWAY
  # ============================================================================
  /payments/create-url:
    post:
      operationId: createPaymentUrl
      tags: [Payments]
      summary: Phát hành URL thanh toán VNPay cho PaymentOrder còn hạn
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentOrderId]
              properties:
                paymentOrderId:
                  type: string
      responses:
        '200':
          description: URL thanh toán VNPay được phát hành thành công.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      paymentUrl:
                        type: string
                        example: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html?vnp_Amount=...
                      expiresAt:
                        type: string
                        format: date-time
        '400':
          description: Đơn đã hết hạn thanh toán hoặc đã đóng.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /payments/vnpay-return:
    get:
      operationId: handleVNPayReturn
      tags: [Payments]
      summary: Xử lý khách hàng quay về từ cổng thanh toán VNPay
      description: Endpoint công khai; xác minh chữ ký và hiển thị trạng thái giao dịch đã lưu tại server.
      parameters:
        - name: vnp_TxnRef
          in: query
          required: true
          schema:
            type: string
        - name: vnp_Amount
          in: query
          required: true
          schema:
            type: string
        - name: vnp_ResponseCode
          in: query
          required: true
          schema:
            type: string
        - name: vnp_SecureHash
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trả về trạng thái xác minh giao dịch cho giao diện client.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [CONFIRMED, FAILED, EXPIRED, REVIEW]
                      bookingRequestId:
                        type: string
                      message:
                        type: string
        '400':
          $ref: '#/components/responses/ValidationError'

  /payments/vnpay-ipn:
    get:
      operationId: handleVNPayIpn
      tags: [Payments]
      summary: Nhận thông báo kết quả thanh toán từ server VNPay (IPN)
      description: |
        Server-to-server webhook từ VNPay. Không yêu cầu JWT hay Cookie.
        Xác minh chữ ký HMAC-SHA512, đối chiếu số tiền, cập nhật trạng thái đơn nguyên tử và outbox email.
      parameters:
        - name: vnp_TxnRef
          in: query
          required: true
          schema:
            type: string
        - name: vnp_Amount
          in: query
          required: true
          schema:
            type: string
        - name: vnp_TransactionNo
          in: query
          required: true
          schema:
            type: string
        - name: vnp_ResponseCode
          in: query
          required: true
          schema:
            type: string
        - name: vnp_TransactionStatus
          in: query
          required: true
          schema:
            type: string
        - name: vnp_SecureHash
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Phản hồi chuẩn theo đặc tả VNPay IPN.
          content:
            application/json:
              schema:
                type: object
                properties:
                  RspCode:
                    type: string
                    example: '00'
                  Message:
                    type: string
                    example: Confirm Success
        '400':
          description: Chữ ký không hợp lệ hoặc dữ liệu tham số thiếu.
          content:
            application/json:
              schema:
                type: object
                properties:
                  RspCode:
                    type: string
                    example: '97'
                  Message:
                    type: string
                    example: Invalid Signature


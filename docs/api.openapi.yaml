# ==============================================================================
# COMPONENTS (SCHEMAS, RESPONSES, PARAMETERS, SECURITY SCHEMES)
# ==============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access Token (10 phút) lưu trong RAM của client, truyền qua header Authorization.
    CookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Refresh Token luân phiên nguyên tử trong cookie HttpOnly.

  parameters:
    CsrfGuardHeader:
      name: X-CSRF-Guard
      in: header
      required: true
      schema:
        type: string
        enum: ['1']
      description: Custom header bảo vệ CSRF bắt buộc cho mutation POST auth

  responses:
    Unauthorized:
      description: Chưa xác thực hoặc Access Token không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Không có quyền truy cập tài nguyên.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Không tìm thấy tài nguyên.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Dữ liệu đầu vào không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimitError:
      description: Vượt quá giới hạn tần suất gửi request (429 Too Many Requests).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ErrorResponse:
      description: Lỗi phản hồi tiêu chuẩn.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Thao tác thực hiện thành công.

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - UNAUTHORIZED
                - ACCESS_TOKEN_EXPIRED
                - SESSION_REVOKED
                - ACCOUNT_LOCKED
                - ACCOUNT_NOT_VERIFIED
                - ACCOUNT_NOT_ACTIVATED
                - FORBIDDEN
                - NOT_FOUND
                - VALIDATION_ERROR
                - SCHEDULE_CONFLICT
                - CONFIG_VERSION_MISMATCH
                - HOLD_EXPIRED
                - PAYMENT_FAILED
                - INVALID_SIGNATURE
                - CSRF_GUARD_TRIGGERED
                - RATE_LIMIT_EXCEEDED
                - INTERNAL_SERVER_ERROR
              example: SCHEDULE_CONFLICT
            message:
              type: string
              example: Khung giờ đã chọn đã có người giữ chỗ hoặc đặt trước.
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string

    RegisterRequest:
      type: object
      required: [email, password, fullName, phoneNumber]
      properties:
        email:
          type: string
          format: email
          example: khachhang@example.com
        password:
          type: string
          minLength: 8
          example: Matkhau@123
        fullName:
          type: string
          example: Nguyễn Văn A
        phoneNumber:
          type: string
          example: '0901234567'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: khachhang@example.com
        password:
          type: string
          example: Matkhau@123

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            accessToken:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            expiresInSeconds:
              type: integer
              example: 600
            user:
              $ref: '#/components/schemas/UserDTO'

    TokenResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            accessToken:
              type: string
            expiresInSeconds:
              type: integer
              example: 600

    ActivateOwnerRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8

    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    UserDTO:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        fullName:
          type: string
        phoneNumber:
          type: string
        role:
          type: string
          enum: [CUSTOMER, OWNER, ADMIN]
        isLocked:
          type: boolean
        emailVerifiedAt:
          type: string
          format: date-time
        activatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    SportDTO:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        isActive:
          type: boolean

    FacilityDTO:
      type: object
      properties:
        id:
          type: string
        ownerId:
          type: string
        name:
          type: string
        description:
          type: string
        address:
          type: string
        province:
          type: string
        phoneNumber:
          type: string
        openTime:
          type: string
          example: '06:00'
        closeTime:
          type: string
          example: '22:00'
        minPricePerHour:
          type: integer
          example: 120000
        coverImageUrl:
          type: string
        status:
          type: string
          enum: [DRAFT, PUBLISHED, PAUSED]

    FacilityDetailDTO:
      allOf:
        - $ref: '#/components/schemas/FacilityDTO'
        - type: object
          properties:
            images:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  url:
                    type: string
                  isCover:
                    type: boolean
            facilitySports:
              type: array
              items:
                $ref: '#/components/schemas/FacilitySportDTO'
            courts:
              type: array
              items:
                $ref: '#/components/schemas/CourtDTO'

    FacilitySportDTO:
      type: object
      properties:
        id:
